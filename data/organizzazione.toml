# Struttura associativa, persone e organizzazioni: la parte dell'archivio che non
# sta dentro un singolo evento. Fonti come in eventi.toml.

# ---------------------------------------------------------------- periodi / assetti
[[periodo]]
nome = "La fondazione"
anni = "2002 – 2005"
sede = "Studio Somma, Via Iannacchini 28, Avellino"
sito = "irlug.org (PHP-Nuke)"
canali = ["mailing list irlug-talk", "canale IRC #irlug su irc.azzurranet.org", "forum sul sito"]
governance = """
Il Manifesto, pubblicato il 25 novembre 2002 e aggiornato il 19 aprile 2003, definisce \
un'associazione senza scopo di lucro, ad adesione libera e gratuita, con tre figure: \
**IRLug Founder** (chi ha fondato il gruppo), **IRLug PR** (il gruppo di coordinamento) \
e **IRLug User** (gli iscritti al sito). Esiste un consiglio direttivo, che tiene la sua \
prima riunione — «virtual-riunione» — il 17 novembre 2003. Tutto il materiale prodotto a \
nome del LUG va distribuito sotto licenza GPL, LGPL o GFDL.
"""
note = """
Il Manifesto conteneva anche una clausola di non discriminazione esplicita — «nessuna \
restrizione di razza, colore, sesso, religione, stato di salute o condizione fisica, \
censo» — e una regola geografica curiosa: l'adesione è aperta a tutti, ma l'azione \
dell'associazione resta legata all'Irpinia.
"""

[[periodo]]
nome = "La riorganizzazione"
anni = "2005 – 2006"
sito = "irlug.altervista.org"
canali = ["mailing list temporanea su rebelsoft.org", "canale IRC #irlug su irc.azzurra.net"]
governance = """
Anni di transizione. Il sito su irlug.org si spegne e il gruppo si sposta su un sito \
statico ospitato su Altervista, curato da Giuseppe Lucarelli su un tema di haran preso \
da Open Source Web Design. La home avvisa: «Causa riorganizzazione del LUG, la mailing \
list non è al momento disponibile». Il dominio irlug.org viene perso e finisce a un \
domain squatter, che lo tiene fino ai primi anni Dieci.
"""

[[periodo]]
nome = "Gli anni Drupal"
anni = "2006 – 2013"
sito = "irlug.it (Drupal)"
canali = ["mailing list di coordinamento", "forum del sito", "canale IRC #irlug"]
governance = """
Il 24 luglio 2006 va online la beta del nuovo sito sul dominio irlug.it. \
Le spese di hosting sono coperte da donazioni dei soci, elencate pubblicamente nella \
pagina *About*: prima Pasquale Ceres, Giuseppe Lucarelli, Francesco Matarazzo, \
Gianluigi Spagnuolo e Giuseppe Zoccano; poi anche Orlando Festa, Luisa Tatoli, \
Michele Carmine Giordano, Cosimo Guglielmucci, Giuseppe Scalzi e «KyAngel».
"""
note = """
Fra il 2009 e il 2013 l'attività si dirada fino a fermarsi: la pagina del Linux Day 2013 \
ammette che «per alcuni anni la manifestazione è saltata ad Avellino».
"""

[[periodo]]
nome = "La seconda vita"
anni = "2013 – oggi"
sede = "c/o Rollstudio, Via F. Iannacone 29, Avellino (sede storica di questa fase)"
sito = "irlug.it (Jekyll, poi Zola)"
canali = ["Telegram", "Facebook", "Instagram", "YouTube", "Flickr", "GitHub", "mailing list"]
governance = """
Il gruppo riparte come «associazione culturale IrLUG» e allarga il raggio: non più solo \
Linux Day, ma anche Arduino Day, e collaborazioni stabili con LUG e community vicine. \
Cambia anche il modo di costruire gli eventi: dal 2019 la call for talks è pubblica, \
dal 2023 c'è la prenotazione online, e il supporto all'installazione per chi porta il \
proprio portatile diventa una costante di ogni edizione.
"""

