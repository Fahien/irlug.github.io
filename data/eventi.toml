tipo = "Divulgazione"
citta = "Manocalzati"
sede = "Informagiovani di Manocalzati"
orario = "16:30"
descrizione = """
Iniziativa personale di Roberto Lenti, socio del LUG, in accordo con l'Informagiovani \
comunale. Presenti il sindaco Pasquale Tirone, il vicesindaco Carlo Castiglione, \
Sabino De Benedetto e Sabino Zara. Il resoconto che Lenti scrisse sul forum — \
applausi sinceri ma pochissimo pubblico, e «scarsa adesione da parte degli stessi \
iscritti a IrLUG, attivi soprattutto in occasione del Linux Day» — è la \
testimonianza più onesta del momento difficile che il gruppo stava attraversando."""
fonti = ["irlug.it/drupal"]

