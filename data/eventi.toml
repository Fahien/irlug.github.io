# Archivio storico IrLUG — fonte unica per la pagina /archivio e per il materiale
# divulgativo (slide, presentazioni). Ogni voce riporta le fonti da cui i dati
# sono stati ricostruiti, cosi' che un domani si possa verificare o correggere.
#
# Fonti ricorrenti:
#   irlug.org      = sito PHP-Nuke 2003-2005 (Wayback Machine)
#   altervista     = irlug.altervista.org, sito 2004-2006 (Wayback Machine)
#   irlug.it/drupal= sito Drupal 2006-2013 (Wayback Machine)
#   blog           = post sul sito attuale
#   locandina      = locandina dell'evento conservata in static/img/events/
#
# `certezza = "parziale"` segnala i dati ricostruiti ma non completi.

