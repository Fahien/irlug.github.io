[[evento]]
anno = 2006
data = "2006-10-28"
data_testo = "sabato 28 ottobre 2006"
titolo = "Linux Day 2006"
tipo = "Linux Day"
citta = "Avellino"
sede = "Garage Records"
indirizzo = "Via Guarini, Avellino"
orario = "10:00 – 13:00"
descrizione = """
Il Linux Day che segna la ripartenza dopo la riorganizzazione del gruppo, ed è il \
primo annunciato dal nuovo sito irlug.it. Il programma non era sul sito ma in un PDF \
mai archiviato: si è ritrovato nell'annuncio che `T4b@cc0` mandò alla lista `annunci` \
della Italian Linux Society il 23 ottobre 2006.

Il giorno dopo, sulla mailing list `debian-italian`, Manlio Perillo raccontava: \
«Un membro del LUG della mia zona (Irlug) ha telefonato a Rai3, e questi sono \
venuti a fare qualche ripresa. Anzi, uno dei due giornalisti si è preso un CD di \
Ubuntu». È l'unica traccia rimasta di una copertura televisiva dell'evento."""
con = ["Italian Linux Society (ILS)"]
fonti = ["irlug.it/drupal", "lists.linux.it/annunci"]
fonti_esterne = ["annunci@lists.linux.it, 23 ottobre 2006", "debian-italian, 29 ottobre 2006"]

