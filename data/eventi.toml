data_testo = "ottobre 2011"
titolo = "Linux Day 2011"
tipo = "Linux Day"
citta = "Avellino"
sede = "non documentata"
certezza = "parziale"
incertezza = """Di questa edizione non resta nulla online: il sito del gruppo era spento \
dal 2009 e sarebbe tornato solo nel 2013. Data, sede e programma non sono documentati; \
il 22 ottobre è la data nazionale del Linux Day 2011."""
descrizione = """
Il Linux Day torna ad Avellino per iniziativa di Hermann Magliacane, che lo rimette \
in piedi da solo scrivendo annunci online e sulle riviste locali, e coinvolge come \
relatori Gennaro «Rino» Ragucci e Patrick Arminio. È l'anello che tiene insieme le \
due epoche del gruppo: senza, fra il 2008 e il 2013 ci sarebbe solo il vuoto."""
fonti = ["testimonianza interna"]

